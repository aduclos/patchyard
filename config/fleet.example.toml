# Fleet patching: site configuration.
# Copy to /etc/fleet/fleet.toml (or point FLEET_CONFIG at it) and edit.
# Every key is optional except where marked REQUIRED; defaults are shown.
# A few keys can also be changed in the web UI (Settings); those changes are
# saved to <paths.state>/settings.json and take precedence over this file.

[site]
name = "Fleet patching"
url = "https://patch.example.com"      # REQUIRED: the dashboard's URL (Origin check, links in alerts)
domain = ""                            # appended to short names on enrollment, e.g. ".corp.example.com"

[paths]
code = "/srv/fleet"                    # this repository
state = "/var/lib/fleet"               # inventory, host_vars, logs, status data (owned by the service account)

[service_account]
name = "svc_patch"                     # local account created on every managed machine
key = "~/.ssh/fleet_ed25519"           # its private key on the controller
allowed_sources = []                   # IPs the key works from; [] = the controller's IPv4 addresses
address_family = "inet"                # inet | inet6 | any

[inventory]
managed_group = "managed"              # Ansible group of machines the tool changes
report_only_group = "report_only"      # shown, never changed

[web]
bind = "127.0.0.1"                     # put a reverse proxy in front, or bind a LAN address
port = 8790
session_hours = 8
serve_static = true

[auth]
method = "kerberos"                    # kerberos | none (none = no sign-in; only for a trusted, local-only setup)
realm = "CORP.EXAMPLE.COM"             # REQUIRED for kerberos
group = "fleetadmins"                  # members may sign in (any NSS group: AD via SSSD, LDAP, or local)
max_failures = 5
failure_window_minutes = 15
lockout_minutes = 15

[checks]
interval_minutes = 15
stale_auto_update_hours = 48           # no successful automatic update for this long = warning
container_memory_days = 3              # a container seen in this window and now gone = problem
release_upgrade_idle_minutes = 15      # release upgrade with no log activity this long = "waiting for input"
digest_hour = 9                        # daily reminder while something waits on you; -1 = off

[notify]
backends = []                          # any of: "ntfy", "webhook", "smtp"

[notify.ntfy]
url = ""                               # e.g. "https://ntfy.sh"
topic = ""
token_file = ""                        # optional access token, read at send time

[notify.webhook]
url = ""                               # POSTed JSON: {"title", "body", "priority", "url"}

[notify.smtp]
host = ""
port = 587
starttls = true
user = ""
password_file = ""
sender = ""
recipients = []

[controller]
host = ""                              # inventory name of the machine running this tool (never patched by it)
reboot_command = []                    # e.g. ["sudo", "-n", "/usr/bin/systemctl", "reboot"]; [] = no reboot button
status_plugin = ""                     # optional executable printing JSON status for the controller
