# Install (or update) the Patchyard controller on the machine you run this on.
#
#   sudo ansible-playbook install/controller.yml                   # defaults below
#   sudo ansible-playbook install/controller.yml -e patchyard_account=patchyard -e patchyard_controller_reboot=true
#
# Idempotent. When it finishes it prints the dashboard address and a one-time setup code:
# the first-run wizard in the browser does the rest (site, sign-in, alerts).
# Creates:
#   * system group {{ patchyard_group }} and system user {{ patchyard_account }} (no password, no login shell)
#   * its SSH key ~{{ patchyard_account }}/.ssh/patchyard_ed25519 and an ssh config that uses the state
#     directory's known_hosts/config (shared with the web service and Ansible)
#   * {{ patchyard_state }} (inventory, host_vars, logs, data) owned by the service account
#   * the Ansible virtualenv and collections inside the code directory
#   * systemd units: patchyard-web.service, patchyard-check.service + .timer
#   * /usr/local/bin/patchyard, the command line (user/token management, checks, config)
#   * optionally a sudo rule letting the service account reboot this machine (patchyard_controller_reboot)
# Then edit {{ patchyard_config }}, put machines in {{ patchyard_state }}/inventory.ini (or use
# "Add machine" in the web UI), and: systemctl enable --now Patchyard-web patchyard-check.timer
- name: Install the Patchyard controller
  hosts: localhost
  connection: local
  become: true
  vars:
    patchyard_code: "{{ playbook_dir | dirname }}"          # this repository
    patchyard_state: /var/lib/patchyard
    patchyard_config: "{{ patchyard_state }}/patchyard.toml"   # written by the setup wizard
    patchyard_config_file: ""                            # or: a ready-made config to install instead
    patchyard_setup_bind: 0.0.0.0                        # where the first-run wizard listens
    patchyard_setup_port: 8790
    patchyard_account: patchyard
    patchyard_group: patchyard
    patchyard_admins: []                                     # local users who may read/edit state (added to patchyard_group)
    patchyard_controller_reboot: false                       # sudo rule for the controller reboot button
    patchyard_python: /usr/bin/python3
    patchyard_home: "/home/{{ patchyard_account }}"
  tasks:
    - name: Python 3.11+ (tomllib)
      ansible.builtin.command: "{{ patchyard_python }} -c 'import sys; assert sys.version_info >= (3, 11)'"
      changed_when: false

    - name: Group
      ansible.builtin.group:
        name: "{{ patchyard_group }}"
        system: true

    - name: Service account
      ansible.builtin.user:
        name: "{{ patchyard_account }}"
        system: true
        home: "{{ patchyard_home }}"
        create_home: true
        shell: /sbin/nologin
        password: "*"
        groups: "{{ patchyard_group }}"
        append: true
        comment: Patchyard service account

    - name: Admins may read and edit the state
      ansible.builtin.user:
        name: "{{ item }}"
        groups: "{{ patchyard_group }}"
        append: true
      loop: "{{ patchyard_admins }}"

    - name: Home and ~/.ssh are private
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ patchyard_account }}"
        group: "{{ patchyard_account }}"
        mode: "0700"
      loop: ["{{ patchyard_home }}", "{{ patchyard_home }}/.ssh"]

    - name: SSH key
      become_user: "{{ patchyard_account }}"
      ansible.builtin.command:
        cmd: ssh-keygen -q -t ed25519 -N '' -C "{{ patchyard_account }}@{{ ansible_facts['hostname'] | default('controller') }}" -f {{ patchyard_home }}/.ssh/patchyard_ed25519
        creates: "{{ patchyard_home }}/.ssh/patchyard_ed25519"

    - name: State directories
      ansible.builtin.file:
        path: "{{ patchyard_state }}/{{ item.path }}"
        state: directory
        owner: "{{ patchyard_account }}"
        group: "{{ patchyard_group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "", mode: "2770"}
        - {path: logs, mode: "2770"}
        - {path: host_vars, mode: "2770"}
        - {path: group_vars, mode: "2770"}
        - {path: ssh, mode: "2770"}
        - {path: www, mode: "2775"}            # the web data must be readable by any web server

    - name: Shared known_hosts (group-writable so admins can record host keys)
      ansible.builtin.copy:
        dest: "{{ patchyard_state }}/ssh/known_hosts"
        content: ""
        force: false
        owner: "{{ patchyard_account }}"
        group: "{{ patchyard_group }}"
        mode: "0664"

    - name: Per-machine ssh settings (ssh refuses an included config others can write)
      ansible.builtin.copy:
        dest: "{{ patchyard_state }}/ssh/config"
        content: "# Machine-specific ssh settings for the service account (Host / HostName blocks).\n"
        force: false
        owner: "{{ patchyard_account }}"
        group: "{{ patchyard_group }}"
        mode: "0644"

    - name: Service account ssh config
      ansible.builtin.copy:
        dest: "{{ patchyard_home }}/.ssh/config"
        owner: "{{ patchyard_account }}"
        group: "{{ patchyard_account }}"
        mode: "0600"
        content: |
          # Written by Patchyard install/controller.yml.
          Include {{ patchyard_state }}/ssh/config
          Host *
            UserKnownHostsFile {{ patchyard_state }}/ssh/known_hosts
            StrictHostKeyChecking yes
            IdentityFile {{ patchyard_home }}/.ssh/patchyard_ed25519
            IdentitiesOnly yes
            # IPv4 keeps the key's from= restriction meaningful when IPv6 privacy addresses rotate;
            # match service_account.address_family in the site configuration.
            AddressFamily inet

    - name: Starter inventory (only if none exists)
      ansible.builtin.copy:
        dest: "{{ patchyard_state }}/inventory.ini"
        force: false
        owner: "{{ patchyard_account }}"
        group: "{{ patchyard_group }}"
        mode: "0664"
        content: |
          # Machines the tool manages. "Add machine" in the web UI appends here.
          [managed]

          # Shown on the dashboard, never changed.
          [report_only]

          [managed:vars]
          ansible_user={{ patchyard_account }}
          ansible_ssh_private_key_file={{ patchyard_home }}/.ssh/patchyard_ed25519

    - name: Ansible virtualenv
      ansible.builtin.pip:
        requirements: "{{ patchyard_code }}/ansible/requirements.txt"
        virtualenv: "{{ patchyard_code }}/ansible/.venv"
        virtualenv_command: "{{ patchyard_python }} -m venv"

    - name: Ansible collections
      ansible.builtin.command:
        cmd: >-
          {{ patchyard_code }}/ansible/.venv/bin/ansible-galaxy collection install
          -r {{ patchyard_code }}/ansible/requirements.yml -p {{ patchyard_code }}/ansible/collections
        creates: "{{ patchyard_code }}/ansible/collections/ansible_collections"

    - name: Code is readable by the service account
      ansible.builtin.file:
        path: "{{ patchyard_code }}"
        mode: "o+rX"
        recurse: true

    - name: Ready-made site configuration (optional; otherwise the setup wizard writes it)
      when: patchyard_config_file | length > 0
      ansible.builtin.copy:
        src: "{{ patchyard_config_file }}"
        dest: "{{ patchyard_config }}"
        force: false
        owner: "{{ patchyard_account }}"
        group: "{{ patchyard_group }}"
        mode: "0640"

    - name: Controller reboot rule (optional)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/patchyard-controller
        mode: "0440"
        validate: visudo -cf %s
        content: |
          # Patchyard: the service account may reboot this machine, nothing else.
          {{ patchyard_account }} ALL=(root) NOPASSWD: /usr/bin/systemctl reboot
      when: patchyard_controller_reboot | bool

    - name: patchyard command (runs as the service account, e.g. `sudo patchyard user add alice`)
      ansible.builtin.copy:
        dest: /usr/local/bin/patchyard
        mode: "0755"
        content: |
          #!/bin/sh
          # Patchyard command line; installed by install/controller.yml.
          if [ "$(id -un)" != "{{ patchyard_account }}" ]; then
              exec sudo -u "{{ patchyard_account }}" "$0" "$@"
          fi
          cd "{{ patchyard_code }}" || exit 1
          export PATCHYARD_CONFIG="{{ patchyard_config }}" PATCHYARD_STATE="{{ patchyard_state }}" PATCHYARD_CODE="{{ patchyard_code }}"
          exec "{{ patchyard_python }}" -m patchyard "$@"

    - name: systemd units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - name: patchyard-web.service
          content: |
            [Unit]
            Description=Patchyard web app and API
            After=network-online.target
            Wants=network-online.target

            [Service]
            User={{ patchyard_account }}
            Group={{ patchyard_group }}
            UMask=0007
            Environment=PATCHYARD_CONFIG={{ patchyard_config }} PATCHYARD_STATE={{ patchyard_state }}
            Environment=PATCHYARD_CODE={{ patchyard_code }} HOME={{ patchyard_home }}
            Environment=PATCHYARD_SETUP_BIND={{ patchyard_setup_bind }} PATCHYARD_SETUP_PORT={{ patchyard_setup_port }}
            WorkingDirectory={{ patchyard_code }}
            # Started via the interpreter: SELinux may not allow systemd to exec scripts in the code dir.
            # Without a configuration it serves the first-run setup wizard.
            ExecStart={{ patchyard_python }} -m patchyard web
            Restart=on-failure
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
        - name: patchyard-check.service
          content: |
            [Unit]
            Description=Patchyard status check (dashboard data + alerts)

            [Service]
            Type=oneshot
            User={{ patchyard_account }}
            Group={{ patchyard_group }}
            UMask=0007
            Environment=PATCHYARD_CONFIG={{ patchyard_config }} PATCHYARD_STATE={{ patchyard_state }} HOME={{ patchyard_home }}
            WorkingDirectory={{ patchyard_code }}
            ExecStart={{ patchyard_python }} -m patchyard check --if-due
        - name: patchyard-check.timer
          content: |
            [Unit]
            Description=Patchyard status check every 5 min (the real interval is checks.interval_minutes)

            [Timer]
            OnBootSec=4min
            OnUnitActiveSec=5min

            [Install]
            WantedBy=timers.target
      notify: reload systemd

    - name: Start the web service and the check timer
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: [patchyard-web.service, patchyard-check.timer]

    - name: Configured already?
      ansible.builtin.stat:
        path: "{{ patchyard_config }}"
      register: configured

    - name: Setup code (the wizard creates it on first start)
      when: not configured.stat.exists
      ansible.builtin.wait_for:
        path: "{{ patchyard_state }}/setup-token"
        timeout: 30

    - name: Read the setup code
      when: not configured.stat.exists
      ansible.builtin.slurp:
        src: "{{ patchyard_state }}/setup-token"
      register: setup_token

    - name: Next step
      ansible.builtin.debug:
        msg: "{{ ['Patchyard is running. Open http://' ~ (ansible_facts['default_ipv4']['address'] | default('<this machine>'))
                  ~ ':' ~ patchyard_setup_port ~ '/ and enter the setup code: '
                  ~ (setup_token.content | b64decode | trim)]
                 if not configured.stat.exists else
                 ['Patchyard is running with ' ~ patchyard_config ~ '. Sign in and use Add machine.'] }}"

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
