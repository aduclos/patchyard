<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Fleet patching</title>
<style>
:root { --bg:#f4f6f9; --s:#fff; --fg:#18202a; --m:#687385; --l:#e3e7ed; --a:#3b6fe0; --af:#fff; --f:#c62a32; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0e1217; --s:#141920; --fg:#e6eaf0; --m:#929cab; --l:#252c36; --a:#6d95ff; --af:#0e1217; --f:#ff6b72; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
       background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
form { background: var(--s); border: 1px solid var(--l); border-radius: 14px; padding: 28px;
       width: min(380px, 100%); display: grid; gap: 14px; }
.brand { display: flex; gap: 10px; align-items: center; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--a); position: relative; }
.logo::after { content: ""; position: absolute; left: 10px; top: 9px; width: 13px; height: 7px;
               border: solid var(--af); border-width: 0 0 3px 3px; transform: rotate(-45deg); }
h1 { font-size: 18px; margin: 0; }
p { margin: 0; color: var(--m); font-size: 13px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--m); }
input { font: inherit; font-size: 15px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--l);
        background: var(--bg); color: var(--fg); }
button { font: inherit; font-weight: 600; padding: 10px; border-radius: 8px; border: 0;
         background: var(--a); color: var(--af); cursor: pointer; }
#err { color: var(--f); font-size: 13px; min-height: 1em; }
</style>
</head>
<body>
<form id="f">
  <div class="brand"><span class="logo" aria-hidden="true"></span><h1>Fleet patching</h1></div>
  <p>Sign in with your account. Members of the configured admin group only.</p>
  <label>Username<input name="u" autocomplete="username" required autofocus></label>
  <label>Password<input name="p" type="password" autocomplete="current-password" required></label>
  <div id="err" role="alert"></div>
  <button>Sign in</button>
</form>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target, err = document.getElementById("err");
  err.textContent = "";
  const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json", "X-Fleet": "1"},
    body: JSON.stringify({username: f.u.value, password: f.p.value})});
  if (r.ok) {
    const next = new URLSearchParams(location.search).get("next") || "/";
    location.href = next.startsWith("/") && !next.startsWith("//") ? next : "/";
    return;
  }
  let j = {};
  try { j = await r.json(); } catch (x) { /* not JSON */ }
  err.textContent = j.error || "Sign-in failed";
  f.p.value = "";
  f.p.focus();
};
</script>
</body>
</html>
