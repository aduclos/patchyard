<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Patchyard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='1.5' y='3.5' width='29' height='25' rx='6' fill='%23161a26' stroke='%2340b5ff' stroke-width='2'/><path d='M8 12l5 4-5 4' fill='none' stroke='%2340b5ff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M15.5 21h8' stroke='%23e7eaf2' stroke-width='2.6' stroke-linecap='round'/></svg>">
<style>
:root { color-scheme: dark; --bg:#141824; --s:#222838; --fg:#e7eaf2; --m:#8a93a8; --l:#2e3549; --a:#40b5ff; --af:#0d1520; --f:#ff6b6b; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
       background: radial-gradient(circle at 30% 20%, #1f2638, var(--bg) 60%); color: var(--fg);
       font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
form { background: var(--s); border: 1px solid var(--l); border-radius: 16px; padding: 30px;
       width: min(380px, 100%); display: grid; gap: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
.brand { display: flex; gap: 12px; align-items: center; }
.logo { width: 38px; height: 38px; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.logo rect { fill: #0f121a; stroke: var(--a); stroke-width: 2; }
.logo .chev { stroke: var(--a); stroke-width: 2.6; }
.logo .cur { stroke: var(--fg); stroke-width: 2.6; animation: blink 1.2s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .logo .cur { animation: none; } }
h1 { font-size: 18px; margin: 0; }
p { margin: 0; color: var(--m); font-size: 13px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--m); }
input { font: inherit; font-size: 15px; padding: 10px 11px; border-radius: 8px; border: 1px solid var(--l);
        background: #1a1e2b; color: var(--fg); }
input:focus { border-color: var(--a); outline: none; }
button { font: inherit; font-weight: 650; padding: 10px; border-radius: 8px; border: 0;
         background: var(--a); color: var(--af); cursor: pointer; }
button:hover { filter: brightness(1.08); }
#err { color: var(--f); font-size: 13px; min-height: 1em; }
</style>
</head>
<body>
<form id="f">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="3.5" width="29" height="25" rx="6"/>
      <path class="chev" d="M8 12l5 4-5 4"/><path class="cur" d="M15.5 21h8"/></svg>
    <h1>Patchyard</h1></div>
  <p>Sign in with your account. Members of the configured admin group only.</p>
  <label>Username<input name="u" autocomplete="username" required autofocus></label>
  <label>Password<input name="p" type="password" autocomplete="current-password" required></label>
  <div id="err" role="alert"></div>
  <button>Sign in</button>
</form>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target, err = document.getElementById("err");
  err.textContent = "";
  const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json", "X-Patchyard": "1"},
    body: JSON.stringify({username: f.u.value, password: f.p.value})});
  if (r.ok) {
    const next = new URLSearchParams(location.search).get("next") || "/";
    location.href = next.startsWith("/") && !next.startsWith("//") ? next : "/";
    return;
  }
  let j = {};
  try { j = await r.json(); } catch (x) { /* not JSON */ }
  err.textContent = j.error || "Sign-in failed";
  f.p.value = "";
  f.p.focus();
};
</script>
</body>
</html>
