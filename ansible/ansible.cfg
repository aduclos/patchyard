# Ansible settings for Patchyard. The engine runs ansible-playbook from this
# directory with PATCHYARD_STATE set; the inventory lives in the state directory.
# machine-settings.json holds the settings edited in the dashboard (patchyard/machines.py);
# host_vars/ and group_vars/ files next to the inventory outrank it.
[defaults]
inventory = $PATCHYARD_STATE/inventory.ini,$PATCHYARD_STATE/machine-settings.json
host_key_checking = True
interpreter_python = auto_silent
forks = 5
stdout_callback = default
retry_files_enabled = False
# Project-local collections, installed from requirements.yml.
collections_path = ./collections

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=10
pipelining = True
