# Ansible settings for ansiblefleet. The engine runs ansible-playbook from this
# directory with FLEET_STATE set; the inventory lives in the state directory.
[defaults]
inventory = $FLEET_STATE/inventory.ini
host_key_checking = True
interpreter_python = auto_silent
forks = 5
stdout_callback = default
retry_files_enabled = False
# Project-local collections, installed from requirements.yml.
collections_path = ./collections

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=10
pipelining = True
