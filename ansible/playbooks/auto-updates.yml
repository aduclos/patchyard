# Make managed machines install their updates by themselves every day and NEVER reboot
# automatically: Debian/Ubuntu (unattended-upgrades, all updates, not just security),
# Fedora/RHEL (dnf-automatic) and Windows (Windows Update policy).
# Rebooting stays a person's call; the dashboard shows who is waiting for one.
#
#   ansible-playbook auto-updates.yml                 every managed machine
#   ansible-playbook auto-updates.yml --limit web1    one machine
# Idempotent: re-run after adding a machine or changing its policy.
#
# Inventory variables (all optional; set them in the dashboard, see patchyard/machines.py):
#   patchyard_auto_updates:               false = the machine keeps its own schedule; left alone
#   patchyard_update_time:                "HH:MM", the machine's local time (default: the system's own
#                                         schedule; Windows 03:00)
#   patchyard_update_spread_minutes:      random delay after that time on Linux (default 30)
#   patchyard_hold_packages:              packages automatic updates must never install
#     packages: ["postgresql-", "libpq"]
#     reason: "..."
#   patchyard_windows_update_mode:        install (default) | download_only
#   patchyard_auto_update_extra_origins:  extra unattended-upgrades Origins-Pattern entries,
#     e.g. ["origin=Docker,codename=${distro_codename}"] to include Docker CE.
# Engine variables: patchyard_managed_group.
- name: Unattended upgrades, no reboots
  hosts: "{{ patchyard_managed_group | default('managed') }}"
  become: true
  # Per-machine values come from inventory. Do not add play-level "vars:" for them:
  # play vars outrank host_vars and would silently blank them.
  tasks:
    - name: Machines that keep their own update schedule
      when: not (patchyard_auto_updates | default(true) | bool)
      block:
        - name: Left alone
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} keeps its own update schedule (patchyard_auto_updates: false)"
        - name: End host
          ansible.builtin.meta: end_host

    # ---------------------------------------------------------------- Fedora / RHEL
    - name: dnf-automatic (apply updates, never reboot)
      when: ansible_facts['os_family'] != 'Windows' and ansible_facts['pkg_mgr'] in ['dnf', 'dnf5', 'yum']
      block:
        - name: Package
          ansible.builtin.dnf:
            name: "{{ 'dnf5-plugin-automatic' if ansible_facts['pkg_mgr'] == 'dnf5' else 'dnf-automatic' }}"
            state: present
        - name: Policy
          ansible.builtin.copy:
            dest: "{{ '/etc/dnf/dnf5-plugins/automatic.conf' if ansible_facts['pkg_mgr'] == 'dnf5' else '/etc/dnf/automatic.conf' }}"
            backup: true
            mode: "0644"
            content: |
              # Managed by Patchyard (playbooks/auto-updates.yml). Local edits are overwritten.
              [commands]
              upgrade_type = default
              download_updates = yes
              apply_updates = yes
              reboot = never
              [emitters]
              emit_via = stdio
        - name: Install time
          ansible.builtin.include_tasks: tasks/update-time.yml
          vars:
            timers:
              - name: "{{ 'dnf5-automatic.timer' if ansible_facts['pkg_mgr'] == 'dnf5' else 'dnf-automatic.timer' }}"
                offset_hours: 0
        - name: Timer on
          ansible.builtin.systemd:
            name: "{{ 'dnf5-automatic.timer' if ansible_facts['pkg_mgr'] == 'dnf5' else 'dnf-automatic.timer' }}"
            enabled: true
            daemon_reload: true
            state: "{{ 'restarted' if update_time_changed | default(false) else 'started' }}"
        - name: Done (dnf)
          ansible.builtin.meta: end_host

    # ---------------------------------------------------------------- Windows
    # Windows Update policy: download and install automatically every day, and do not
    # restart while someone is signed in. Windows can still restart on its own when nobody
    # is signed in; set patchyard_windows_update_mode: download_only to prevent that entirely
    # (updates then wait for Patch).
    - name: Windows Update policy
      when: ansible_facts['os_family'] == 'Windows'
      block:
        - name: Policy values
          ansible.windows.win_regedit:
            path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
            name: "{{ item.name }}"
            data: "{{ item.data }}"
            type: dword
          loop:
            - {name: NoAutoUpdate, data: 0}
            - {name: AUOptions, data: "{{ 3 if (patchyard_windows_update_mode | default('install')) == 'download_only' else 4 }}"}
            - {name: ScheduledInstallDay, data: 0}
            - {name: ScheduledInstallTime, data: "{{ (patchyard_update_time | default('03:00'))[:2] | int }}"}
            - {name: NoAutoRebootWithLoggedOnUsers, data: 1}
        - name: Done (Windows)
          ansible.builtin.meta: end_host

    # ---------------------------------------------------------------- macOS
    # Check and download every day; install security responses and system data files by
    # themselves (they need no restart). macOS system updates wait for Patch or the owner, so
    # the Mac never restarts on its own.
    - name: macOS Software Update policy
      when: ansible_facts['os_family'] == 'Darwin'
      block:
        - name: Software Update settings
          ansible.builtin.command:
            argv: [defaults, write, /Library/Preferences/com.apple.SoftwareUpdate, "{{ item.key }}", -bool, "{{ item.value }}"]
          loop:
            - {key: AutomaticCheckEnabled, value: "true"}
            - {key: AutomaticDownload, value: "true"}
            - {key: CriticalUpdateInstall, value: "true"}
            - {key: ConfigDataInstall, value: "true"}
            - {key: AutomaticallyInstallMacOSUpdates, value: "false"}
          changed_when: true
        - name: App Store apps update themselves
          ansible.builtin.command:
            argv: [defaults, write, /Library/Preferences/com.apple.commerce, AutoUpdate, -bool, "true"]
          changed_when: true
        - name: Done (macOS)
          ansible.builtin.meta: end_host

    - name: No automatic-update policy for this system yet
      when: ansible_facts['os_family'] != 'Windows' and ansible_facts['pkg_mgr'] != 'apt'
      block:
        - name: Not supported
          ansible.builtin.debug:
            msg: "no automatic-update policy for {{ ansible_facts['pkg_mgr'] }} yet; Patch still works"
        - name: End
          ansible.builtin.meta: end_host

    - name: unattended-upgrades installed
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Daily list refresh + upgrade
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        backup: true
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    # apt config lists are additive, so this extends the stock
    # 50unattended-upgrades (security only) instead of replacing it.
    - name: Patchyard policy (all updates, no reboot)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52patchyard-auto-updates
        backup: true
        mode: "0644"
        content: |
          // Managed by Patchyard (playbooks/auto-updates.yml). Local edits are overwritten.
          Unattended-Upgrade::Allowed-Origins {
                  "${distro_id}:${distro_codename}-updates";
                  "${distro_id}ESMApps:${distro_codename}-apps-updates";
                  "${distro_id}ESM:${distro_codename}-infra-updates";
          };
          Unattended-Upgrade::Origins-Pattern {
          {% for o in patchyard_auto_update_extra_origins | default([]) %}
                  "{{ o }}";
          {% endfor %}
          };
          Unattended-Upgrade::Package-Blacklist {
          {% for p in (patchyard_hold_packages | default({})).packages | default([]) %}
                  "{{ p }}";
          {% endfor %}
          };
          Unattended-Upgrade::Automatic-Reboot "false";
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          // A half-configured dpkg would block every later run.
          Dpkg::Options { "--force-confdef"; "--force-confold"; };

    - name: Remove the policy file's old name (renamed to 52patchyard-auto-updates)
      ansible.builtin.file:
        path: /etc/apt/apt.conf.d/52fleet-auto-updates
        state: absent

    - name: Effective policy
      ansible.builtin.shell: >-
        apt-config dump | grep -E '^Unattended-Upgrade::(Allowed-Origins|Origins-Pattern|Package-Blacklist)::|Automatic-Reboot'
        | sed 's/^Unattended-Upgrade:://'
      register: effective
      changed_when: false

    - name: Install time (package lists are refreshed an hour earlier)
      ansible.builtin.include_tasks: tasks/update-time.yml
      vars:
        timers:
          - {name: apt-daily.timer, offset_hours: -1}
          - {name: apt-daily-upgrade.timer, offset_hours: 0}

    - name: Timers on
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if update_time_changed | default(false) else 'started' }}"
      loop: [apt-daily.timer, apt-daily-upgrade.timer]

    - name: Result
      ansible.builtin.debug:
        msg: "{{ effective.stdout_lines }}"
